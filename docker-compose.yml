services:
  server:
    build:
      context: ./apps/server
      dockerfile: Dockerfile
    ports:
      - '4000:4000'
    environment:
      - NODE_ENV=development
      - PORT=4000
      - REDIS_URL=redis://redis:6379
      - CLIENT_ORIGIN=chrome-extension://*
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - binge-room

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - binge-room

volumes:
  redis_data:

networks:
  binge-room:
    driver: bridge
