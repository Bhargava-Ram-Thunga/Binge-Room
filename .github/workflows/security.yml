name: Security

on:
  push:
    branches: [main, dev, prod]
  pull_request:
  schedule:
    - cron: "30 1 * * 1" # weekly deep scan, Monday 01:30 UTC

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so leaks in past commits are caught
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
